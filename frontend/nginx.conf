server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Uploady: import CAP, wgrywanie biblioteki skutków
    client_max_body_size 20m;

    # Wejście na goły adres → przekieruj na prefiks aplikacji
    location = / { return 302 /osmet-dev/; }

    # API pod prefiksem — proxy do backendu.
    # Prefiks pozwala, by kilka aplikacji za wspólnym proxy miało własne /api.
    location /osmet-dev/api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # generowanie PDF/PNG i zbiorczy eksport
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }

    # Aplikacja (SPA) pod prefiksem
    location /osmet-dev/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /osmet-dev/index.html;
    }

    # index.html bez cache — inaczej po aktualizacji wisi stara wersja
    location = /osmet-dev/index.html {
        alias /usr/share/nginx/html/index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
