# IMGW-OSMET — nginx (instalacja bez Dockera)
# Umieść w /etc/nginx/sites-available/osmet (Debian/Ubuntu)
#      lub /etc/nginx/conf.d/osmet.conf (RHEL/Rocky/Fedora)

server {
    listen 80;
    # listen 8080;                 # jeśli port 80 jest zajęty
    server_name _;                 # np. osmet.firma.local

    root /var/www/osmet;           # tu trafia zawartość frontend/dist
    index index.html;

    # Uploady: import CAP i wgrywanie biblioteki skutków z kreatora
    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # API → uvicorn na loopbacku (systemd: osmet-backend.service)
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generowanie PDF z mapami i zbiorczy eksport ZIP potrafią trwać
        proxy_read_timeout    300s;
        proxy_connect_timeout 10s;
        proxy_buffering       off;   # płynne pobieranie dużych ZIP-ów
    }

    # SPA — odświeżenie na /status czy /historia nie może dawać 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Statyki z długim cache. UWAGA: index.html BEZ cache, żeby po aktualizacji
    # nie wisiała stara wersja aplikacji (to źródło „numer wersji się nie zmienił").
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
