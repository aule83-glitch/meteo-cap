# apps-proxy — jedna brama dla wszystkich aplikacji na maszynie container.imgw.ad
#
# Zasada: proxy NIE obcina prefiksu (brak ukośnika na końcu proxy_pass).
# Kontener aplikacji sam obsługuje swój prefiks, dzięki czemu ta sama
# aplikacja działa tak samo:
#   • przez proxy:      http://apps.container.imgw.ad/osmet-dev/
#   • bezpośrednio:     http://container.imgw.ad:31001/osmet-dev/
# Nie trzeba utrzymywać dwóch konfiguracji ani przepisywać ścieżek.

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # ── IMGW-OSMET (generator ostrzeżeń, narzędzie deweloperskie) ──
    location /osmet-dev/ {
        proxy_pass http://meteocap-frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;      # PDF/PNG i zbiorcze eksporty
        proxy_buffering off;
    }

    # ── Case Explorer ──
    # Odkomentuj po uruchomieniu kontenera casexp (patrz case-explorer/docker-compose.yml)
    # location /casexp/ {
    #     proxy_pass http://casexp:80;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }

    # ── RADVOL-3D — miejsce na kolejną aplikację ──
    # location /radvol/ {
    #     proxy_pass http://radvol-frontend:80;
    #     proxy_set_header Host $host;
    # }

    # ── Strona startowa: spis aplikacji ──
    location = / {
        default_type text/html;
        return 200 '<!doctype html><html lang="pl"><meta charset="utf-8">
<title>Aplikacje — IMGW</title>
<style>body{background:#0b1320;color:#e8eef6;font-family:system-ui,sans-serif;padding:48px}
a{color:#38bdf8;text-decoration:none;font-size:18px}li{margin:10px 0}
small{color:#7e93b0}</style>
<h1>Aplikacje</h1><ul>
<li><a href="/osmet-dev/">IMGW-OSMET</a> <small>— generator ostrzeżeń (narzędzie deweloperskie)</small></li>
</ul></html>';
    }
}
